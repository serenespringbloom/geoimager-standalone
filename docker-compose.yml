services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: geoimager
      POSTGRES_PASSWORD: geoimager
      POSTGRES_DB: geoimager
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoimager"]
      interval: 3s
      timeout: 3s
      retries: 10

  python-service:
    build: ./python-service
    ports:
      - "8080:8080"
    environment:
      PORT: 8080

  api:
    build: ./api
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      DATABASE_URL: postgres://geoimager:geoimager@db:5432/geoimager
      GEOIMAGER_URL: http://python-service:8080
    depends_on:
      db:
        condition: service_healthy
      python-service:
        condition: service_started

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8787
    depends_on:
      - api

volumes:
  db-data:
